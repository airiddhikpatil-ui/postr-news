name: Publish
on:
  workflow_dispatch:
    inputs:
      job:
        description: preview-intro (render only) or post-intro (post to Facebook and Instagram)
        required: true
        default: preview-intro
      targets:
        description: Where to post
        required: false
        default: facebook,instagram
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: poster-engine
      - run: npx playwright install --with-deps chromium
        working-directory: poster-engine
      - run: node publisher/run.js
        env:
          NODE_PATH: ${{ github.workspace }}/poster-engine/node_modules
          JOB: ${{ inputs.job }}
          TARGETS: ${{ inputs.targets }}
          OUT_DIR: out
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      - name: Save preview image to the previews branch
        if: inputs.job == 'preview-intro'
        run: |
          mkdir -p /tmp/p && cp out/*.png /tmp/p/
          git config user.name "postr-bot"
          git config user.email "postr-bot@users.noreply.github.com"
          git checkout --orphan previews
          git rm -rf --quiet . || true
          cp /tmp/p/*.png .
          git add *.png
          git commit -m "Preview $(date -u +%FT%TZ)"
          git push -f origin previews
