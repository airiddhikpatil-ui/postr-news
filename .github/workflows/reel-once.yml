name: One-time Reel (Diwali scams)
# Posts the Diwali scam Reel once: 28 Oct 2026, 7:37 pm India time (14:07 UTC).
on:
  schedule:
    - cron: '7 14 28 10 *'
  workflow_dispatch:
    inputs:
      only:
        description: Post this Reel id now (empty = next in line)
        required: false
        default: ''
      dry_run:
        description: true = upload and process only, publish nothing
        required: false
        default: 'false'
permissions:
  contents: write
concurrency: publish
jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
        working-directory: poster-engine
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node publisher/run.js
        env:
          NODE_PATH: ${{ github.workspace }}/poster-engine/node_modules
          JOB: post-reel
          ONLY: diwali-scams
          DRY_RUN: ${{ inputs.dry_run }}
          OUT_DIR: out
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      - name: Record what was posted
        if: always()
        run: |
          git config user.name "postr-bot"
          git config user.email "postr-bot@users.noreply.github.com"
          git add publisher/reels/*.posted.json 2>/dev/null || true
          git add publisher/batches/cooldown.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Reel posted log $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
