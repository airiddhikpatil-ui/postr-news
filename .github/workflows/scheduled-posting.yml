name: Scheduled posting
# Every 90 minutes from about 8 am to 11 pm India time (about 11 posts a day) while the account is new.
# Off the busy :00/:30 minutes, which GitHub often skips.
# Catch-up double posting is off (CATCH_UP=0) while the account is new.
on:
  schedule:
    - cron: '37 2,5,8,11,14,17 * * *'
    - cron: '7 4,7,10,13,16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  post-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: poster-engine
      - run: npx playwright install --with-deps chromium
        working-directory: poster-engine
      - run: node publisher/run.js
        env:
          NODE_PATH: ${{ github.workspace }}/poster-engine/node_modules
          JOB: post-next
          OUT_DIR: out
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      - name: Record what was posted
        if: always()
        run: |
          git config user.name "postr-bot"
          git config user.email "postr-bot@users.noreply.github.com"
          git add publisher/batches/*.posted.json 2>/dev/null || true
          git add publisher/collabs/log.json 2>/dev/null || true
          git add publisher/batches/cooldown.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Posted log $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
