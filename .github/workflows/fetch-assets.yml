name: Fetch studio assets
# Downloads photo plates (e.g. Canva exports) into poster-engine/assets/plates/ and commits them.
# Input: a JSON object {"name.png": "https://...", ...}
on:
  workflow_dispatch:
    inputs:
      assets:
        description: 'JSON map of file name -> URL'
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          ASSETS: ${{ inputs.assets }}
        run: |
          mkdir -p poster-engine/assets/plates
          node -e '
            const fs = require("fs");
            const map = JSON.parse(process.env.ASSETS);
            (async () => {
              for (const [name, url] of Object.entries(map)) {
                if (!/^[a-z0-9._-]+\.(png|jpg|jpeg|mp4)$/i.test(name)) throw new Error("bad name " + name);
                const r = await fetch(url);
                if (!r.ok) throw new Error(name + " HTTP " + r.status);
                const buf = Buffer.from(await r.arrayBuffer());
                fs.writeFileSync("poster-engine/assets/plates/" + name, buf);
                console.log(name, buf.length, "bytes");
              }
            })().catch((e) => { console.error(e); process.exit(1); });
          '
      - name: Commit
        run: |
          git config user.name "postr-bot"
          git config user.email "postr-bot@users.noreply.github.com"
          git add poster-engine/assets/plates
          git commit -m "Add studio plates" || exit 0
          git pull --rebase -q && git push
